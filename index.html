function mrhFuzzyRun(q,max,useStrong){ // বলা কথা থেকে সবচেয়ে কাছের পণ্যগুলো (সবচেয়ে ভালো আগে)

const popts=a=>`<option value="">সাধারণ ক্রেতা / নগদ`.replace('সাধারণ ক্রেতা / নগদ',a)+D[a=='সাধারণ ক্রেতা'?'cu':'su'].map(c=>`<option value="${c.id}">${esc(c.name)} (বাকি ${tk(c.bal)})`).join('');
function selP(w){const p=D.p.find(x=>x.id==$('#'+w+'p').value);if(!p){$('#'+w+'u').innerHTML='';return}$('#'+w+'u').innerHTML=Object.keys(units(p)).map(k=>`<option${k==dn(p)?' selected':''}>${k}`).join('');if(w=='s')fillPr()}
function byTk(){const t=+$('#sta').value,pr=+$('#spr').value;if(t>0&&pr>0)$('#sq').value=+(t/pr).toFixed(4)}
function fillPr(){const p=D.p.find(x=>x.id==$('#sp').value);if(p)$('#spr').value=nf(priceU(p,$('#su').value))}
V.sell=()=>D.p.length?`<h2>বিক্রি (বিল)</h2><div class="card"><input id="ssq" placeholder="🔍 পণ্য খুঁজুন (নামের কিছু অংশ লিখুন)" oninput="fSel('s')"><select id="sp" onchange="selP('s')">${popt()}</select><div class="row"><input id="sq" type="number" step="any" placeholder="কতটুকু" oninput="$('#sta').value=''"><select id="su" onchange="fillPr()"></select></div><label>দাম (প্রতি ইউনিট)</label><input id="spr" type="number" step="any"><label>অথবা টাকায় দিন (পরিমাণ নিজে বের হবে)</label><input id="sta" type="number" step="any" placeholder="যেমন ৫০ টাকা" oninput="byTk()"><button class="b" onclick="addLine()">＋ বিলে যোগ করুন</button></div><div id="cart"></div>`:'<p class="m">আগে স্টক ট্যাবে পণ্য যোগ করুন।</p>';
function addLine(){const p=D.p.find(x=>x.id==$('#sp').value),u=$('#su').value,tk0=+$('#sta').value,pr=+$('#spr').value,qn=tk0>0&&pr>0?tk0/pr:+$('#sq').value;if(!p||!(qn>0)||!(pr>=0))return alert('পরিমাণ ও দাম দিন');const m=qn*units(p)[u],inC=cart.filter(c=>c.id==p.id).reduce((s,c)=>s+c.m,0);
if(m+inC>p.stock+1e-9)return alert('স্টকে আছে মাত্র '+fq(p,p.stock-inC));if(pr<minU(p,u)&&!confirm('দাম সর্বনিম্ন দামের ('+tk(minU(p,u))+') কম। তবুও বিক্রি করবেন?'))return;
cart.push({id:p.id,n:p.name,q:qn,u,pr,m,amt:qn*pr});$('#sq').value='';$('#sta').value='';drawCart()}
function drawCart(){const t=sum(cart,'amt');$('#cart').innerHTML=cart.length?`<div class="card">${cart.map((l,i)=>`<div class="tr"><div><b>${esc(l.n)}</b><small>${fh(l.q)} ${l.u} × ${tk(l.pr)}</small></div><span>${tk(l.amt)} <button class="s" onclick="cart.splice(${i},1);drawCart()">✕</button></span></div>`).join('')}<div class="row"><b>মোট</b><b>${tk(t)}</b></div><label>ক্রেতা</label><select id="sc">${popts('সাধারণ ক্রেতা')}</select><input id="scn" placeholder="খাতায় নেই এমন ক্রেতার নাম লিখুন (শুধু রিসিটে ছাপা হবে)"><label>নগদ জমা (ফাঁকা = পুরো টাকা)</label><input id="spd" type="number" step="any"><label>বিক্রির তারিখ (আগের দিনের বিক্রি হলে তারিখ বদলান)</label><input type="date" id="sdt" value="${sd||td()}" max="${td()}" onchange="sd=this.value"><button class="b" onclick="sell()">বিক্রি নিশ্চিত করুন</button></div>`:''}
function sell(){if(!cart.length)return;markUndo('বিক্রি');const tot=sum(cart,'amt'),c=D.cu.find(x=>x.id==$('#sc').value);const raw=$('#spd').value;let paid=raw===''?tot:+raw;if(!Number.isFinite(paid)||paid<0||paid>tot){alert('জমার টাকা ০ থেকে মোট বিলের মধ্যে দিন');return}if(!c)paid=tot;
const T=sd&&sd!=td()?new Date(sd+'T12:00:00').getTime():Date.now();
const b={id:uid(),no:D.n++,cid:c?c.id:'',t:T,items:cart.map(x=>({...x})),tot,paid,due:tot-paid,cust:c?c.name:((($('#scn')||{}).value||'').trim()||'সাধারণ ক্রেতা')};
cart.forEach(l=>{const p=D.p.find(x=>x.id==l.id);p.stock-=l.m;D.tx.push({id:uid(),k:'s',t:b.t,n:l.n+' ('+nf(l.q)+' '+l.u+')',amt:l.amt,pf:l.amt-l.m*p.buy,pid:l.id,m:l.m})});
if(c)c.bal+=b.due;D.bl.push(b);cart=[];sd='';save();go('sell');receipt(b.id)}
function receipt(id){const b=D.bl.find(x=>x.id==id);if(!b)return;dlg(`<div class="rc"><div style="text-align:center">${D.shop.logo?`<img class="lg" src="${D.shop.logo}" alt="">`:''}<h3 style="margin:4px">${esc(D.shop.name)}</h3><small>বিল #${b.no} • ${dt(b.t)}<br>ক্রেতা: ${esc(b.cust)}</small></div><table>${b.items.map(i=>`<tr><td>${esc(i.n)}<br><small>${fh(i.q)} ${i.u} × ${tk(i.pr)}</small><td align="right">${tk(i.amt)}`).join('')}<tr class="tt"><td>মোট<td align="right">${tk(b.tot)}${b.rv?`<tr><td>ফেরত<td align="right">-${tk(b.rv)}<tr class="tt"><td>ফেরতের পর মোট<td align="right">${tk(b.tot-b.rv)}`:''}<tr><td>জমা<td align="right">${tk(b.paid)}<tr><td>বাকি<td align="right">${tk(b.due)}</table><p style="text-align:center">ধন্যবাদ, আবার আসবেন!</p></div><div class="row nop"><button class="s" onclick="retForm('${b.id}')">↩ ফেরত</button><button class="b" onclick="print()">প্রিন্ট</button><button class="s" onclick="cl()">বন্ধ</button></div>`)}
function retForm(id){const b=D.bl.find(x=>x.id==id);dlg(`<h3>বিল #${b.no} — ফেরত</h3><form onsubmit="return doRet(event,'${id}')">${b.items.map((i,k)=>`<label>${esc(i.n)} — কেনা ${nf(i.q)} ${i.u}${i.rq?`, আগে ফেরত ${nf(i.rq)}`:''}</label><input type="number" step="any" min="0" id="rq${k}" placeholder="ফেরতের পরিমাণ (${i.u})">`).join('')}<button class="b">ফেরত নিশ্চিত করুন</button><button type="button" class="s" onclick="receipt('${id}')">বাতিল</button></form>`)}
function doRet(e,id){e.preventDefault();markUndo('পণ্য ফেরত');const b=D.bl.find(x=>x.id==id),L=[];let R=0;
for(let k=0;k<b.items.length;k++){const i=b.items[k],v=+$('#rq'+k).value;if(!(v>0))continue;if(v>i.q-(i.rq||0)+1e-9){alert(i.n+': এত পরিমাণ ফেরত হবে না');return false}L.push([i,v])}
if(!L.length){alert('ফেরতের পরিমাণ দিন');return false}
L.forEach(([i,v])=>{const p=D.p.find(x=>x.id==i.id),m=v*i.m/i.q,a=v*i.pr;i.rq=(i.rq||0)+v;R+=a;if(p)p.stock+=m;D.tx.push({id:uid(),k:'r',t:Date.now(),n:i.n+' ফেরত ('+nf(v)+' '+i.u+')',amt:-a,pf:-(a-m*(p?p.buy:0)),pid:i.id,m})});
b.rv=(b.rv||0)+R;const c=D.cu.find(x=>x.id==b.cid)||D.cu.find(x=>!b.cid&&x.name==b.cust);let cut=0;if(c&&b.due>0){cut=Math.min(R,b.due);b.due-=cut;c.bal=Math.max(0,c.bal-cut)}const cashRefund=R-cut;if(cashRefund>0)b.paid=Math.max(0,b.paid-cashRefund);
save();toast('ফেরত: '+tk(R)+(cut?' (বাকি কমেছে '+tk(cut)+')':' — নগদ ফেরত দিন'));receipt(id);return false}
V.buy=()=>!window.OWN?'<p class="m">মাল কেনার হিসাব শুধু মালিক ব্যবহার করতে পারবেন।</p>':D.p.length?`<h2>নতুন মাল এলে স্টক বাড়ান</h2><button class="s" onclick="purchaseHistory()">📚 ক্রয় ও সরবরাহকারীর ইতিহাস</button><div class="card"><input id="bsq" placeholder="🔍 পণ্য খুঁজুন (নামের কিছু অংশ লিখুন)" oninput="fSel('b')"><select id="bp" onchange="selP('b')">${popt()}</select><div class="row"><input id="bq" type="number" step="any" placeholder="কতটুকু এলো"><select id="bu"></select></div><label>মোট কত টাকায় কিনলেন</label><input id="bt" type="number" step="any"><label>মহাজন / সরবরাহকারী</label><select id="bs">${popts('নগদ')}</select><label>চালান / ইনভয়েস নম্বর (ঐচ্ছিক)</label><input id="binv" placeholder="চালান নম্বর"><label>মাল কেনার তারিখ</label><input id="bdate" type="date" value="${td()}"><label>নোট (ঐচ্ছিক)</label><input id="bnote" placeholder="পরিবহন খরচ বা অন্যান্য তথ্য"><label>নগদ দিলেন (ফাঁকা = পুরো টাকা)</label><input id="bpd" type="number" step="any"><button class="b" onclick="buy()">স্টকে যোগ করুন</button></div>`:'<p class="m">আগে স্টক ট্যাবে পণ্য যোগ করুন।</p>';
function purchaseHistory(){const L=D.tx.filter(x=>x.k==='b').slice().sort((a,b)=>b.t-a.t);dlg(`<h3>📚 ক্রয় ও সরবরাহকারীর ইতিহাস</h3>${L.map(x=>`<div class="card"><b>${esc(x.n)}</b><div class="tr"><small>${dt(x.t)} • তারিখ: ${esc(x.purchaseDate||'—')}</small><b>${tk(x.amt)}</b></div><small class="m">সরবরাহকারী: ${esc(x.supplier||'নগদ')} ${x.invoice?' • চালান: '+esc(x.invoice):''}</small>${x.unitCost?`<small class="m">একক ক্রয়মূল্য: ${tk(x.unitCost)}</small>`:''}${x.note?`<small class="m">নোট: ${esc(x.note)}</small>`:''}</div>`).join('')||'<p class="m">এখনো কোনো ক্রয় রেকর্ড নেই।</p>'}<button class="s" onclick="cl()">বন্ধ</button>`)}
function buy(){if(!window.OWN)return alert('মাল কেনার অনুমতি শুধু মালিকের');markUndo('মাল কেনা');const p=D.p.find(x=>x.id==$('#bp').value);if(!p)return;const qn=+$('#bq').value,c=+$('#bt').value,u=$('#bu').value,m=qn*units(p)[u];if(!(qn>0&&c>=0))return alert('পরিমাণ ও মোট টাকা দিন');
const s=D.su.find(x=>x.id==$('#bs').value);const rawPaid=$('#bpd').value;let pd=rawPaid===''?c:+rawPaid;if(!Number.isFinite(pd)||pd<0||pd>c)return alert('পরিশোধের টাকা ০ থেকে মোট কেনার টাকার মধ্যে দিন');if(!s)pd=c;if(s)s.bal+=c-pd;p.stock+=m;if(c>0){p.buy=c/m;p.priceHistory=p.priceHistory||[];p.priceHistory.push({t:Date.now(),buy:p.buy,sell:p.sell,source:'মাল কেনা'});if(p.priceHistory.length>100)p.priceHistory=p.priceHistory.slice(-100)}
D.tx.push({id:uid(),k:'b',t:Date.now(),n:p.name+' ('+nf(qn)+' '+u+')',amt:c,pf:0,pid:p.id,qty:qn,unit:u,baseQty:m,unitCost:m?c/m:0,supplier:s?s.name:'নগদ',supplierId:s?s.id:'',purchaseDate:$('#bdate')?.value||td(),invoice:$('#binv')?.value||'',note:$('#bnote')?.value||''});save();go('buy');toast('স্টকে যোগ হয়েছে')}

V.khata=()=>`<h2>খাতা</h2><div class="tabs"><button class="${kt=='cu'?'on':''}" onclick="kt='cu';go('khata')">ক্রেতার বাকি</button><button class="${kt=='su'?'on':''}" onclick="kt='su';go('khata')">মহাজনের পাওনা</button></div><button class="b" onclick="addParty()">＋ নতুন ${kt=='cu'?'ক্রেতা':'মহাজন'}</button>`+(D[kt].map(x=>`<div class="card"><b ${kt=='cu'?`onclick="cdet('${x.id}')"`:''}>${esc(x.name)}</b> <small class="m">${esc(x.phone||'')}</small>${kt=='su'&&x.phone?` <a href="tel:${String(x.phone).replace(/[^+0-9]/g,'')}">📞 কল</a> <a href="https://wa.me/${String(x.phone).replace(/[^0-9]/g,'')}" target="_blank" rel="noopener">💬 মেসেজ</a>`:''}${kt=='cu'?lastBk(x):''}<div class="row"><span class="${x.bal>0?'neg':''}">${kt=='cu'?'বাকি':'দেনা'}: ${tk(x.bal)}</span><span style="display:flex;gap:6px"><button class="s" onclick="pay('${x.id}')">${kt=='cu'?'টাকা নিলাম':'টাকা দিলাম'}</button>${kt=='cu'?`<button class="s" onclick="cdet('${x.id}')">📋 বিবরণ</button>`:`<button class="s" onclick="addBal('${x.id}')">＋ বাকি</button>`}<button class="s" onclick="delParty('${x.id}')">🗑</button></span></div></div>`).join('')||'<p class="m">কেউ নেই</p>');
function addParty(){const n=(prompt('নাম')||'').trim();if(!n)return;const phone=prompt('ফোন (না থাকলে ফাঁকা)')||'',bal=+prompt('আগের '+(kt=='cu'?'বাকি':'দেনা')+' (না থাকলে 0)','0')||0;const notes=kt=='cu'?(prompt('কাস্টমার নোট (ঐচ্ছিক)')||''):'',dueDate=kt=='cu'?(prompt('বাকি পরিশোধের তারিখ YYYY-MM-DD (ঐচ্ছিক)')||''):'';D[kt].push({id:uid(),name:n,phone,bal,notes,dueDate});save();go('khata')}
function addBal(id){const x=D[kt].find(y=>y.id==id),a=+prompt(x.name+' — কত টাকা বাকি যোগ করবেন?')||0;if(!(a>0))return;x.bal+=a;save();go('khata');toast('বাকি যোগ হয়েছে: '+tk(a))}
function cEnt(c){const L=[];
 D.bl.filter(b=>b.cid==c.id).forEach(b=>L.push({t:b.t,k:'bill',items:b.items.map(i=>i.n+' '+nf(i.q)+' '+i.u).join(', '),amt:b.due,sub:'বিল #'+b.no+' • মোট '+tk(b.tot-(b.rv||0))+', জমা '+tk(b.paid)}));
 D.tx.filter(x=>x.cid==c.id&&(x.k=='bk'||x.k=='rc')).forEach(x=>L.push({t:x.t,k:x.k,items:x.items||'',amt:x.amt,img:x.img}));
 return L.sort((a,b)=>b.t-a.t)}
function lastBk(c){const e=cEnt(c).find(e=>e.k!='rc'&&e.items);return e?`<small class="m" style="display:block">📦 ${esc(e.items)}</small>`:''}
function viewImg(s){dlg(`<img src="${s}" style="width:100%;border-radius:8px"><button class="s" onclick="cl()">বন্ধ</button>`)}
function cdet(id){const c=D.cu.find(x=>x.id==id);if(!c)return;
dlg(`<h3>${esc(c.name)}</h3><small class="m">${esc(c.phone||'')}</small>${c.notes?`<p>📝 ${esc(c.notes)}</p>`:''}${c.dueDate?`<p>📅 বাকি দেওয়ার তারিখ: ${esc(c.dueDate)}</p>`:''}<div class="row"><b class="${c.bal>0?'neg':''}">মোট বাকি: ${tk(c.bal)}</b></div>${cEnt(c).map(e=>`<div class="tr"><div style="flex:1"><b>${e.k=='rc'?'টাকা জমা':'বাকি'} • ${dt(e.t)}</b>${e.items?`<small>📦 ${esc(e.items)}</small>`:''}${e.sub?`<small>${e.sub}</small>`:''}</div>${e.img?`<img class="th" src="${e.img}" onclick="viewImg(this.src)">`:''}<span class="${e.k=='rc'?'pos':'neg'}">${e.k=='rc'?'-':''}${tk(e.amt)}</span></div>`).join('')||'<p class="m">কোনো বাকির লেনদেন নেই</p>'}<button class="s" onclick="editCustomerNote('${id}')">📝 নোট / তারিখ বদলান</button><button class="b" onclick="bakiForm('${id}')">＋ বাকি দিন (মালামাল/ছবি সহ)</button><button class="s" onclick="cl()">বন্ধ</button>`)}
function editCustomerNote(id){const c=D.cu.find(x=>x.id==id);if(!c)return;const n=prompt('কাস্টমার নোট',c.notes||'');if(n===null)return;const d=prompt('বাকি পরিশোধের তারিখ YYYY-MM-DD (ফাঁকা = নেই)',c.dueDate||'');if(d===null)return;c.notes=n;c.dueDate=d;save();cdet(id)}
function bakiForm(id){const c=D.cu.find(x=>x.id==id);
dlg(`<h3>${esc(c.name)} — বাকি</h3><form onsubmit="return saveBaki(event,'${id}')"><label>কী মালামাল দিলেন</label><input id="bi" placeholder="যেমন: সিমেন্ট ২ বস্তা, রড ১০ কেজি" required><label>বাকির টাকা</label><input id="ba" type="number" step="any" required><label>ছবি (ঐচ্ছিক — ক্যামেরা বা গ্যালারি)</label><input type="file" id="bim" accept="image/*"><button class="b">সংরক্ষণ করুন</button><button type="button" class="s" onclick="cdet('${id}')">বাতিল</button></form>`)}
function saveBaki(e,id){e.preventDefault();const c=D.cu.find(x=>x.id==id),a=+$('#ba').value,it=$('#bi').value.trim(),f=$('#bim').files[0];if(!(a>0))return false;
const done=img=>{c.bal+=a;D.tx.push({id:uid(),k:'bk',t:Date.now(),n:c.name+' — '+it,amt:a,pf:0,cid:id,items:it,img:img||''});save();go('khata');cdet(id);toast('বাকি যোগ হয়েছে: '+tk(a))};
f?rd(f,500,done):done();return false}
function delParty(id){const x=D[kt].find(y=>y.id==id);if(!confirm(x.name+' কে মুছে ফেলবেন?'+(x.bal>0?'\nএখনো '+tk(x.bal)+' বাকি আছে!':'')))return;D[kt]=D[kt].filter(y=>y.id!=id);save();go('khata')}

      catch(e){mb=p}
    }
  }
}
window.cloudSave=()=>{clearTimeout(timer);timer=setTimeout(push,700)};

function fin(){
  if(!live&&ready>=SYNC_COL.length+(SYNC_META?1:0)){live=true;ui=1;push()}
  if(ui){ui=0;refresh()}
}
function listen(){
  unsubs=SYNC_COL.map(k=>onSnapshot(collection(db,cn(k)),snap=>{
    if(!first[k]){
      if(snap.empty&&snap.metadata.fromCache)return;
      first[k]=1;
      if(!snap.empty){D[k]=[];base[k]={};snap.docs.forEach(d=>merge(k,d.id,d.data()));srt(D[k]);ui=1}
      ready++;
    }else{
      let c=0;
      snap.docChanges().forEach(x=>{
        const id=x.doc.id;
        if(x.type=='removed'){if(base[k][id]){D[k]=D[k].filter(y=>y.id!=id);delete base[k][id];c=1}}
        else if(merge(k,id,x.doc.data()))c=1;
      });
      if(c){srt(D[k]);ui=1}
    }
    fin();
  },e=>toast('ক্লাউড সংযোগে সমস্যা')));
  if(SYNC_META)unsubs.push(onSnapshot(doc(db,'store',PFX+'meta2'),s=>{
    if(!first.m){if(!s.exists()&&s.metadata.fromCache)return;first.m=1;ready++}
    if(s.exists()){
      const d=s.data(),sh=JSON.parse(d.j),keep=mb&&cs(D.shop)!=mb.s;let n=d.n||0;
      if(mb)n+=D.n-mb.n;
      const ch=(!keep&&cs(D.shop)!=cs(sh))||D.n!=n;
      if(!keep)D.shop=sh;D.n=n;mb={s:cs(sh),n:d.n||0};
      if(ch)ui=1;
    }
    fin();
  },e=>toast('ক্লাউড সংযোগে সমস্যা')));
}

// পুরোনো এক-ডকুমেন্টের ডেটা থাকলে নতুন কাঠামোয় আনা (শুধু হার্ডওয়্যারের জন্য)
async function migrate(){
  try{
    for(const k of COL){
      if((await getDocs(collection(db,k))).empty){const o=await getDoc(doc(db,'store',k));if(o.exists())D[k]=JSON.parse(o.data().j)}
    }
    if(!(await getDoc(doc(db,'store','meta2'))).exists()){const o=await getDoc(doc(db,'store','meta'));if(o.exists()){const v=JSON.parse(o.data().j);D.shop=v.shop;D.n=v.n}}
  }catch(e){}
}

window.login=async e=>{
  e.preventDefault();
  $('#lm').textContent='';
  try{await signInWithEmailAndPassword(auth,$('#le').value.trim(),$('#lp').value)}
  catch(x){$('#lm').textContent='লগইন হয়নি: ইমেইল বা পাসওয়ার্ড ভুল'}
  return false;
};
window.logout=()=>{cl();signOut(auth)};

// ৫ মিনিট কিছু না ছুঁলে অটো লগআউট (সময় বদলাতে 5 বদলান)
let idle;
const resetIdle=()=>{clearTimeout(idle);if(auth.currentUser)idle=setTimeout(()=>signOut(auth),5*60*1000)};
["click","keydown","touchstart","input"].forEach(e=>document.addEventListener(e,resetIdle,{passive:true}));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)resetIdle()});

onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];live=false;ready=0;ui=0;mb=null;first.m=0;
  const em=u?(u.email||'').toLowerCase():'';
  const isOwner=em==OWNER.toLowerCase();
  const isBro=em==BRO.toLowerCase();
  const isEmp=em==EMP.toLowerCase();
  if(u&&!isOwner&&!isBro&&!isEmp){
    await signOut(auth);
    $('#lm').textContent='এই অ্যাকাউন্টের অনুমতি নেই';
    $('#lo').style.display='grid';
    return;
  }
  PFX=isBro?'m_':'';window.PFX=PFX;
  SYNC_COL=COL;
  SYNC_META=true;
  if(u)useShop(isBro);
  COL.forEach(k=>{base[k]={};first[k]=0});
  $('#lo').style.display=u?'none':'grid';
  resetIdle();
  window.OWN=!!u&&isOwner;window.AI_ENABLED=!!u;if(u)setTimeout(()=>{try{aiGet()}catch(e){}},1500);
  document.querySelector('nav button[data-v=buy]').style.display=isOwner?'':'none';
  if(u){th();hd()}
  go(cur);
  if(u){if(isOwner)await migrate();listen()}
});
</script>
