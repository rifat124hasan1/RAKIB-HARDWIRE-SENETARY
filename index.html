<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>রাকিব হার্ডওয়্যার অ্যান্ড স্যানিটারি</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Hind+Siliguri:wght@400;600;700&family=Anek+Bangla:wght@400;600;700&family=Baloo+Da+2:wght@400;600;700&family=Noto+Serif+Bengali:wght@400;600;700&family=Atma:wght@400;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
:root{--a:#2f5d8a;--y:#f2b705;--bg:#f1f3f5;--c:#fff;--t:#1c2530;--m:#6b7785;--l:#dde1e6;--g:#1e8e5a;--r:#c8372d}
body.dk{--bg:#12171d;--c:#1c242d;--t:#e8ecf0;--m:#8e9aa7;--l:#2c3743}
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins','Noto Sans Bengali',system-ui,sans-serif;background:var(--bg);color:var(--t);padding:0 0 84px;font-size:16px}
header{background:var(--a);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:4px solid var(--y)}
header h1{font-size:18px;margin:0;flex:1;line-height:1.2}
header img,.lgo{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#fff;display:grid;place-items:center;font-size:24px}
header button{background:none;border:0;color:#fff;font-size:22px}
main{padding:12px;max-width:640px;margin:auto}
h2,h3{margin:14px 0 8px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{background:var(--c);border-left:4px solid var(--a);padding:10px;border-radius:6px}
.st small{display:block;color:var(--m)}.st b{font-size:22px}
.card{background:var(--c);border:1px solid var(--l);border-radius:8px;padding:10px;margin:8px 0}
.tr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--l)}
.tr small{display:block;color:var(--m)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pos{color:var(--g);font-weight:600}.neg{color:var(--r);font-weight:600}.m{color:var(--m)}
input,select{width:100%;padding:10px;border:1px solid var(--l);border-radius:6px;background:var(--bg);color:var(--t);font:inherit;margin:3px 0}
label{font-size:14px;color:var(--m);display:block;margin-top:6px}
button.b,button.s{width:100%;padding:11px;border-radius:6px;border:0;font:inherit;font-weight:600;margin:6px 0}
button.b{background:var(--a);color:#fff}button.s{background:var(--l);color:var(--t);width:auto;padding:8px 12px}
button.d{background:var(--r);color:#fff;width:100%;padding:11px;border:0;border-radius:6px;font:inherit;margin:6px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--m);padding:8px 0;font:inherit;font-size:12px;border-top:3px solid transparent}
nav button span{display:block;font-size:20px}nav button.on{color:var(--a);border-top-color:var(--y);font-weight:700}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:9px;border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:6px;font:inherit}.tabs button.on{background:var(--a);color:#fff}
.th{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--l);display:grid;place-items:center;flex:none}
dialog{border:0;border-radius:10px;width:min(94vw,460px);max-height:90vh;background:var(--c);color:var(--t);padding:14px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.rc table{width:100%;border-collapse:collapse;margin-top:8px}.rc td{padding:5px 0;border-bottom:1px dashed var(--l)}.rc .tt td{font-weight:700}.rc small{color:var(--m)}.lg{width:60px;height:60px;border-radius:50%;object-fit:cover}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none}
#lo{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:20px}
#lo .box{background:var(--c);border:1px solid var(--l);border-radius:10px;padding:20px;width:min(94vw,380px);text-align:center}
.fr{font-size:.6em;font-style:normal}
.card,.st{border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.07);border:0}
.st{border-left:0;border-top:4px solid var(--y)}
.st b{font-weight:700;letter-spacing:-.3px}
button.b{border-radius:12px;padding:13px;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.15)}
button.s{border-radius:20px}
input,select{border-radius:10px;padding:11px}
nav{border-radius:18px 18px 0 0;box-shadow:0 -3px 12px rgba(0,0,0,.08)}
nav button.on{border-top-color:transparent;position:relative}
nav button.on span{background:var(--a);color:#fff;border-radius:14px;padding:2px 14px;margin:0 auto 2px;width:fit-content}
.tr b,.card b{font-weight:600}
@media print{header,nav,main,.nop,#toast,#lo{display:none!important}dialog{box-shadow:none;border:0}}
</style></head><body>
<header></header><main id="main"></main>
<nav>
<button data-v="home" onclick="go('home')"><span>🏠</span>হোম</button>
<button data-v="stock" onclick="go('stock')"><span>📦</span>স্টক</button>
<button data-v="sell" onclick="go('sell')"><span>💰</span>বিক্রি</button>
<button data-v="buy" onclick="go('buy')"><span>🚚</span>মাল কেনা</button>
<button data-v="khata" onclick="go('khata')"><span>📒</span>খাতা</button>
<button data-v="acc" onclick="go('acc')"><span>📊</span>হিসাব</button>
</nav>
<dialog id="dlg"></dialog><div id="toast"></div>
<input type="file" id="lf" accept="image/*" hidden><input type="file" id="imf" accept="application/json" hidden>

<!-- লগইন পর্দা -->
<div id="lo"><form class="box" onsubmit="return login(event)">
<h3>রাকিব হার্ডওয়্যার অ্যান্ড স্যানিটারি</h3>
<input id="le" type="email" placeholder="ইমেইল" autocomplete="username" required>
<input id="lp" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password" required>
<button class="b">লগইন</button>
<p id="lm" class="neg"></p>
</form></div>

<script>
const K='rakib_hs_v1';
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
D=D||{shop:{name:'রাকিব হার্ডওয়্যার অ্যান্ড স্যানিটারি',logo:'',color:'#2f5d8a',dark:0},p:[],tx:[],cu:[],su:[],ex:[],bl:[],n:1};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert('সেভ করা যায়নি, জায়গা শেষ হয়ে গেছে। ব্যাকআপ নিন।')};window.cloudSave&&window.cloudSave()};
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=x=>+(+x).toFixed(3),tk=n=>'৳'+(Math.round(n*100)/100).toLocaleString('en-IN'),sum=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800)};
const dlg=h=>{$('#dlg').innerHTML=h;$('#dlg').showModal()},cl=()=>$('#dlg').close();
// units: factor = কত মূল একক এক ইউনিটে
const U={piece:{main:'পিস',u:{'পিস':1}},weight:{main:'কেজি',u:{'কেজি':1,'গ্রাম':.001,'পাউন্ড':.45359237}},liquid:{main:'লিটার',u:{'লিটার':1,'মিলিলিটার':.001}},length:{main:'মিটার',u:{'মিটার':1,'ফুট':.3048,'গজ':.9144,'ইঞ্চি':.0254}}};
const TN={piece:'পিস (সংখ্যায়)',weight:'ওজন (কেজি/গ্রাম/পাউন্ড)',liquid:'তরল (লিটার/মিলি)',length:'দৈর্ঘ্য (মিটার/ফুট/গজ/ইঞ্চি)'};
const units=p=>{const u={...U[p.type].u};if(p.type=='piece'&&p.pack>1)u['প্যাকেট']=p.pack;return u};
const priceU=(p,u)=>u=='প্যাকেট'&&p.packPrice?p.packPrice:p.sell*units(p)[u];
const minU=(p,u)=>u=='প্যাকেট'&&p.packMin?p.packMin:(p.min||0)*units(p)[u];
const dn=p=>p.du&&U[p.type].u[p.du]?p.du:U[p.type].main,df=p=>U[p.type].u[dn(p)];
const fq=(p,q)=>{const t=p.type,d=dn(p);if(d!=U[t].main)return nf(q/df(p))+' '+d;if(t=='weight'&&q&&Math.abs(q)<1)return nf(q*1000)+' গ্রাম';if(t=='liquid'&&q&&Math.abs(q)<1)return nf(q*1000)+' মিলি';return nf(q)+' '+U[t].main};
const fh=x=>{x=+x;const a=Math.abs(x),w=Math.trunc(a),r=a-w,s=x<0?'-':'';
 for(const [n,d] of [[1,2],[1,4],[3,4],[1,3],[2,3],[1,8],[3,8],[5,8],[7,8]])
  if(Math.abs(r-n/d)<.001)return s+(w?w+' ':'')+`<i class="fr">${n}/${d}</i>`;
 return nf(x)};
const fqh=(p,q)=>{const t=p.type,d=dn(p);
 if(d!=U[t].main)return fh(q/df(p))+' '+d;
 if(t=='weight'&&q&&Math.abs(q)<1)return fh(q*1000)+' গ্রাম';
 if(t=='liquid'&&q&&Math.abs(q)<1)return fh(q*1000)+' মিলি';
 return fh(q)+' '+U[t].main};
const lab={r:'ফেরত',s:'বিক্রি',b:'কেনা',rc:'বাকি আদায়',pd:'মহাজনকে পরিশোধ',bk:'বাকি দেওয়া'};
const dt=t=>new Date(t).toLocaleString('bn-BD',{dateStyle:'short',timeStyle:'short'});
const row=x=>`<div class="tr"><div><b>${esc(x.n)}</b><small>${lab[x.k]} • ${dt(x.t)}</small></div><span class="${x.k=='s'||x.k=='rc'?'pos':'neg'}">${tk(x.amt)}</span></div>`;
function rd(f,sz,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,sz/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.readAsDataURL(f)}
function th(){
  document.documentElement.style.setProperty('--a',D.shop.color);
  document.body.classList.toggle('dk',!!D.shop.dark);
  if(D.shop.tc)document.body.style.setProperty('--t',D.shop.tc);
  else document.body.style.removeProperty('--t');
  const z=(D.shop.fs||16)/16;
  $('#main').style.zoom=z;$('#dlg').style.zoom=z;
  document.body.style.fontFamily=`'${D.shop.fe||'Poppins'}','${D.shop.fb||'Noto Sans Bengali'}',system-ui,sans-serif`;
}
function hd(){$('header').innerHTML=`${D.shop.logo?`<img src="${D.shop.logo}" alt="" onclick="$('#lf').click()">`:`<div class="lgo" onclick="$('#lf').click()">🏪</div>`}<h1>${esc(D.shop.name)}</h1><button onclick="st()" aria-label="সেটিংস">⚙</button>`}
$('#lf').onchange=e=>rd(e.target.files[0],200,d=>{D.shop.logo=d;save();hd();toast('লোগো বদলেছে')});
let cur='home',cart=[],kt='cu',per=7,q='',so='n';
const V={};
function go(v){cur=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));$('#main').innerHTML=V[v]();({stock:drawStock,sell:()=>{selP('s');drawCart()},buy:()=>selP('b')}[v]||(()=>{}))();scrollTo(0,0)}
V.home=()=>{const d0=new Date().setHours(0,0,0,0),s=D.tx.filter(x=>x.t>=d0&&(x.k=='s'||x.k=='r')),low=D.p.filter(p=>p.stock<=p.low);const c=(l,v)=>`<div class="st"><small>${l}</small><b>${v}</b></div>`;
return `<div class="g">${c('আজকের বিক্রি',tk(sum(s,'amt')))}${c('আজকের লাভ',tk(sum(s,'pf')))}${c('স্টকে আটকা টাকা',tk(D.p.reduce((a,p)=>a+p.stock*p.buy,0)))}${c('মোট পণ্য',D.p.length)}${c('ক্রেতার বাকি',tk(sum(D.cu,'bal')))}${c('মহাজনের পাওনা',tk(sum(D.su,'bal')))}</div><h3>⚠️ কম স্টকের পণ্য</h3>${low.map(p=>`<div class="tr"><b>${esc(p.name)}</b><span class="neg">${p.stock>0?fqh(p,p.stock):'স্টক শেষ'}</span></div>`).join('')||'<p class="m">কম স্টকের পণ্য নেই</p>'}<h3>সাম্প্রতিক লেনদেন</h3>${D.tx.slice(-8).reverse().map(row).join('')||'<p class="m">এখনো কোনো লেনদেন নেই</p>'}`};
// ---- স্টক
V.stock=()=>`<div class="row"><h2>স্টক</h2><button class="s" onclick="pf()">＋ নতুন পণ্য</button></div><input placeholder="পণ্য খুঁজুন" value="${esc(q)}" oninput="q=this.value;drawStock()"><select onchange="so=this.value;drawStock()">${[['n','নাম অনুসারে'],['low','কম স্টক আগে'],['sh','স্টক বেশি আগে'],['pl','দাম কম → বেশি'],['ph','দাম বেশি → কম']].map(o=>`<option value="${o[0]}"${so==o[0]?' selected':''}>${o[1]}`).join('')}</select><div id="sl"></div>`;
function drawStock(){let L=D.p.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));const f={n:(a,b)=>a.name.localeCompare(b.name),low:(a,b)=>a.stock-b.stock,sh:(a,b)=>b.stock-a.stock,pl:(a,b)=>a.sell-b.sell,ph:(a,b)=>b.sell-a.sell}[so];L.sort(f);
$('#sl').innerHTML=L.map(p=>`<div class="card row" onclick="pf('${p.id}')">${p.img?`<img class="th" src="${p.img}" alt="">`:`<div class="th">📦</div>`}<div style="flex:1"><b>${esc(p.name)}</b><small class="m" style="display:block">বিক্রয় ${tk(p.sell*df(p))}/${dn(p)} • ক্রয় ${tk(p.buy*df(p))}</small></div><b class="${p.stock<=p.low?'neg':''}">${fqh(p,p.stock)}</b></div>`).join('')||'<p class="m">কোনো পণ্য নেই। ওপরের বোতাম দিয়ে যোগ করুন।</p>'}
function pf(id){const p=D.p.find(x=>x.id==id)||{type:'piece',stock:0,low:5},f=id?df(p):1,v=x=>x?+(x*f).toFixed(4):'';
dlg(`<h3>${id?'পণ্য এডিট':'নতুন পণ্য'}</h3><form onsubmit="return sp(event,'${id||''}')"><label>পণ্যের ছবি</label><input type="file" id="pimg" accept="image/*"><label>পণ্যের নাম</label><input id="pn" required value="${esc(p.name||'')}"><label>পণ্যের ধরন</label><select id="ty" onchange="setT()">${Object.keys(TN).map(k=>`<option value="${k}"${p.type==k?' selected':''}>${TN[k]}`).join('')}</select>
<label>মূল একক (দাম ও স্টক এই এককে দেখাবে)</label><select id="du" onchange="setT()" data-v="${id?dn(p):''}"></select>
<label>ক্রয়মূল্য (প্রতি <span class="mu"></span>)</label><input id="pb" type="number" step="any" required value="${v(p.buy)}">
<label>বিক্রয়মূল্য (প্রতি <span class="mu"></span>)</label><input id="ps" type="number" step="any" required value="${v(p.sell)}">
<label>সর্বনিম্ন বিক্রয়মূল্য (প্রতি <span class="mu"></span>)</label><input id="pm" type="number" step="any" value="${v(p.min)}">
<div id="pkb"><label>এক প্যাকেটে কয়টা পিস? (প্যাকেটে না বেচলে ফাঁকা)</label><input id="pk" type="number" value="${p.pack||''}"><label>প্যাকেটের বিক্রয়মূল্য</label><input id="pkp" type="number" step="any" value="${p.packPrice||''}"><label>প্যাকেটের সর্বনিম্ন মূল্য</label><input id="pkm" type="number" step="any" value="${p.packMin||''}"></div>
<label>বর্তমান স্টক</label><div class="row"><input id="pst" type="number" step="any" required value="${+(p.stock/f).toFixed(4)}"><select id="sku"></select></div>
<label>কম স্টকের সীমা (<span class="mu"></span>)</label><input id="pl" type="number" step="any" value="${+((p.low??5)/f).toFixed(4)}">
<button class="b">সংরক্ষণ করুন</button>${id?`<button type="button" class="d" onclick="delP('${id}')">পণ্য মুছুন</button>`:''}<button type="button" class="s" onclick="cl()">বাতিল</button></form>`);setT()}
function setT(){const t=$('#ty').value,d=$('#du'),keep=d.value||d.dataset.v,same=d.dataset.t==t,of=+d.dataset.f||1;
d.innerHTML=Object.keys(U[t].u).map(k=>`<option${k==keep?' selected':''}>${k}`).join('');const n=d.value,f2=U[t].u[n];
if(same&&of!=f2){['pb','ps','pm'].forEach(i=>{const e=$('#'+i);if(e.value)e.value=+(e.value*f2/of).toFixed(4)});['pst','pl'].forEach(i=>{const e=$('#'+i);if(e.value)e.value=+(e.value*of/f2).toFixed(4)})}
d.dataset.t=t;d.dataset.f=f2;
document.querySelectorAll('.mu').forEach(e=>e.textContent=n);$('#sku').innerHTML=Object.keys(U[t].u).map(k=>`<option${k==n?' selected':''}>${k}`).join('');$('#pkb').style.display=t=='piece'?'':'none'}
function sp(e,id){e.preventDefault();const g=i=>$('#'+i).value,ty=g('ty'),du=g('du'),f=U[ty].u[du];const o={name:g('pn').trim(),type:ty,du:du,buy:+g('pb')/f,sell:+g('ps')/f,min:(+g('pm')||0)/f,pack:ty=='piece'?+g('pk')||0:0,packPrice:+g('pkp')||0,packMin:+g('pkm')||0,low:(+g('pl')||0)*f,stock:+g('pst')*U[ty].u[g('sku')]};
const done=img=>{if(id)Object.assign(D.p.find(x=>x.id==id),o,img?{img}:{});else D.p.push({id:uid(),img:img||'',...o});save();cl();go('stock')};const f0=$('#pimg').files[0];f0?rd(f0,120,done):done();return false}
function delP(id){if(confirm('এই পণ্য মুছে ফেলবেন?')){D.p=D.p.filter(x=>x.id!=id);save();cl();go('stock')}}
// ---- বিক্রি ও কেনা
const popt=()=>D.p.map(p=>`<option value="${p.id}">${esc(p.name)} — ${fq(p,p.stock)}`).join('');
const popts=a=>`<option value="">সাধারণ ক্রেতা / নগদ`.replace('সাধারণ ক্রেতা / নগদ',a)+D[a=='সাধারণ ক্রেতা'?'cu':'su'].map(c=>`<option value="${c.id}">${esc(c.name)} (বাকি ${tk(c.bal)})`).join('');

function doRet(e,id){e.preventDefault();const b=D.bl.find(x=>x.id==id),L=[];let R=0;
for(let k=0;k<b.items.length;k++){const i=b.items[k],v=+$('#rq'+k).value;if(!(v>0))continue;if(v>i.q-(i.rq||0)+1e-9){alert(i.n+': এত পরিমাণ ফেরত হবে না');return false}L.push([i,v])}

// inMemoryPersistence: লগইন সেভ থাকে না, অ্যাপ খুললেই পাসওয়ার্ড চাইবে
const app=initializeApp(firebaseConfig),auth=initializeAuth(app,{persistence:inMemoryPersistence}),db=getFirestore(app);
// প্রতিটা পণ্য/বিল/লেনদেন আলাদা ডকুমেন্ট; স্টক ও বাকি যোগ-বিয়োগ করে সিঙ্ক হয়
const COL=['p','cu','su','ex','tx','bl'],CNT={p:'stock',cu:'bal',su:'bal'};
const base={},first={};let mb=null,unsubs=[],timer=null,live=false,ready=0,ui=0;
const cp=o=>JSON.parse(JSON.stringify(o));
const cs=o=>JSON.stringify(o,(k,v)=>v&&typeof v=='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(x=>[x,v[x]])):v);
const srt=a=>a.sort((x,y)=>(x.t||0)-(y.t||0)||(x.id<y.id?-1:1));
const split=(k,o)=>{o=cp(o);const f=CNT[k],c=f?+o[f]||0:0;if(f)delete o[f];return{o,s:cs(o),c}};
function refresh(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){};th();hd();if(!$('#dlg').open)go(cur)}

function merge(k,id,sv){
  const f=CNT[k],i=D[k].findIndex(x=>x.id==id),b=base[k][id],ss=split(k,sv);
  let o=ss.o,c=ss.c;
  if(i>=0&&b){const l=split(k,D[k][i]);if(l.s!=b.s)o={...ss.o,...l.o};c=ss.c+(l.c-b.c)}
  const n=f?{...o,[f]:c}:{...o};
  base[k][id]={s:ss.s,c:ss.c};
  const ch=i<0||cs(D[k][i])!=cs(n);
  if(i<0)D[k].push(n);else D[k][i]=n;
  return ch;
}

async function push(){
  if(!live||!auth.currentUser)return;
  for(const k of COL){
    const f=CNT[k],have=new Set();
    for(const it of D[k]){
      have.add(it.id);
      const b=base[k][it.id],l=split(k,it);
      if(b&&b.s===l.s&&(!f||b.c===l.c))continue;
      const prev=b;base[k][it.id]={s:l.s,c:l.c};
      try{await setDoc(doc(db,k,it.id),f?{...l.o,[f]:increment(l.c-(prev?prev.c:0))}:l.o,{merge:!!f})}
      catch(e){base[k][it.id]=prev;toast('ক্লাউডে সেভ হয়নি, ইন্টারনেট দেখুন')}
    }
    for(const id of Object.keys(base[k])){
      if(have.has(id))continue;
      const prev=base[k][id];delete base[k][id];
      try{await deleteDoc(doc(db,k,id))}catch(e){base[k][id]=prev}
    }
  }
  const ms=cs(D.shop),n=D.n;
  if(!mb||mb.s!=ms||mb.n!=n){
    const p=mb;mb={s:ms,n};
    try{await setDoc(doc(db,'store','meta2'),{j:JSON.stringify(D.shop),n:increment(n-(p?p.n:0))},{merge:true})}
    catch(e){mb=p}
  }
}
window.cloudSave=()=>{clearTimeout(timer);timer=setTimeout(push,700)};

function fin(){
  if(!live&&ready>=COL.length+1){live=true;ui=1;push()}
  if(ui){ui=0;refresh()}
}
function listen(){
  unsubs=COL.map(k=>onSnapshot(collection(db,k),snap=>{
    if(!first[k]){
      if(snap.empty&&snap.metadata.fromCache)return;
      first[k]=1;
      if(!snap.empty){D[k]=[];base[k]={};snap.docs.forEach(d=>merge(k,d.id,d.data()));srt(D[k]);ui=1}
      ready++;
    }else{
      let c=0;
      snap.docChanges().forEach(x=>{
        const id=x.doc.id;
        if(x.type=='removed'){if(base[k][id]){D[k]=D[k].filter(y=>y.id!=id);delete base[k][id];c=1}}
        else if(merge(k,id,x.doc.data()))c=1;
      });
      if(c){srt(D[k]);ui=1}
    }
    fin();
  },e=>toast('ক্লাউড সংযোগে সমস্যা')));
  unsubs.push(onSnapshot(doc(db,'store','meta2'),s=>{
    if(!first.m){if(!s.exists()&&s.metadata.fromCache)return;first.m=1;ready++}
    if(s.exists()){
      const d=s.data(),sh=JSON.parse(d.j),keep=mb&&cs(D.shop)!=mb.s;let n=d.n||0;
      if(mb)n+=D.n-mb.n;
      const ch=(!keep&&cs(D.shop)!=cs(sh))||D.n!=n;
      if(!keep)D.shop=sh;D.n=n;mb={s:cs(sh),n:d.n||0};
      if(ch)ui=1;
    }
    fin();
  },e=>toast('ক্লাউড সংযোগে সমস্যা')));
}

// পুরোনো এক-ডকুমেন্টের ডেটা থাকলে নতুন কাঠামোয় আনা
async function migrate(){
  try{
    for(const k of COL){
      if((await getDocs(collection(db,k))).empty){const o=await getDoc(doc(db,'store',k));if(o.exists())D[k]=JSON.parse(o.data().j)}
    }
    if(!(await getDoc(doc(db,'store','meta2'))).exists()){const o=await getDoc(doc(db,'store','meta'));if(o.exists()){const v=JSON.parse(o.data().j);D.shop=v.shop;D.n=v.n}}
  }catch(e){}
}

  $('#lm').textContent='';
  try{await signInWithEmailAndPassword(auth,$('#le').value.trim(),$('#lp').value)}
  catch(x){$('#lm').textContent='লগইন হয়নি: ইমেইল বা পাসওয়ার্ড ভুল'}
  return false;
};
window.logout=()=>{cl();signOut(auth)};

// ৫ মিনিট কিছু না ছুঁলে অটো লগআউট (সময় বদলাতে 5 বদলান)

["click","keydown","touchstart"].forEach(e=>document.addEventListener(e,resetIdle));

onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];live=false;ready=0;ui=0;mb=null;first.m=0;
  COL.forEach(k=>{base[k]={};first[k]=0});
  $('#lo').style.display=u?'none':'grid';
  resetIdle();
window.OWN=!!u&&(u.email||'').toLowerCase()=='teammrhlive@gmail.com';document.querySelector('nav button[data-v=buy]').style.display=window.OWN?'':'none';go(cur);
  if(u){await migrate();listen()}
});
</script>
