const mrhNorm=s=>String(s||'').toLowerCase().replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/[৳,!?।ঃ]/g,' ').replace(/\s+/g,' ').trim();

 if(mrhState&&mrhState.step==='price'){const n=mrhNum(text);if(!(n>0)){mrhSay('বিক্রির প্রতি ইউনিট দামটি বলুন।');return}mrhState.price=n;mrhState.step='confirm';mrhSay(`${mrhState.p.name}, ${mrhState.qty} ${dn(mrhState.p)} × ${tk(n)} = ${tk(mrhState.qty*n)}। এটি বিক্রির বিলে যোগ করব? হ্যাঁ বা না বলুন।`);return}

<!-- Firebase: লগইন + সিঙ্ক + দুই দোকান -->
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {initializeAuth,browserLocalPersistence,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {getFirestore,doc,collection,setDoc,deleteDoc,getDoc,getDocs,onSnapshot,increment} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCYOlNIYnPhFKin-Z0kD8r4Gan9ryUVBJo",
  authDomain:"rakib-hardwire--senetary-13b1f.firebaseapp.com",
  projectId:"rakib-hardwire--senetary-13b1f",
  storageBucket:"rakib-hardwire--senetary-13b1f.firebasestorage.app",
  messagingSenderId:"80631125508",
  appId:"1:80631125508:web:142b0c6d50dbf094680751"
};
// দুই দোকান: ভাইয়ের ইমেইলে ঢুকলে সব ডেটা m_ দিয়ে শুরু আলাদা জায়গায় যায়
const OWNER='teammrhlive@gmail.com',BRO='mudidokan@gmail.com',EMP='rifat@gmail.com';
let PFX='';const cn=k=>PFX+k;
const app=initializeApp(firebaseConfig),auth=initializeAuth(app,{persistence:browserLocalPersistence}),db=getFirestore(app);
// ---- MRH AI: Firebase AI Logic (Gemini Developer API). এপিআই কী কোডে নেই, Firebase কনসোল থেকে চালু করা থাকে
let aiLoad=null;
window.mrhGemini=async(modelName,system,contents)=>{
  if(!auth.currentUser)throw new Error('login');
  if(!aiLoad)aiLoad=(async()=>{
    const B='https://www.gstatic.com/firebasejs/12.17.0/';
    const [A,I]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-ai.js')]);
    const a2=A.initializeApp(firebaseConfig,'mrh-ai');
    return {I,ai:I.getAI(a2,{backend:new I.GoogleAIBackend()})};
  })().catch(e=>{aiLoad=null;throw e});
  const {I,ai}=await aiLoad;
  const model=I.getGenerativeModel(ai,{model:modelName,systemInstruction:system,generationConfig:{responseMimeType:'application/json',temperature:0.2}});
  const res=await model.generateContent({contents});
  return res.response.text();
};
const COL=['p','cu','su','ex','tx','bl'],CNT={p:'stock',cu:'bal',su:'bal'};
let SYNC_COL=COL,SYNC_META=true;
const base={},first={};let mb=null,unsubs=[],timer=null,live=false,ready=0,ui=0;
const cp=o=>JSON.parse(JSON.stringify(o));
const cs=o=>JSON.stringify(o,(k,v)=>v&&typeof v=='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(x=>[x,v[x]])):v);
const srt=a=>a.sort((x,y)=>(x.t||0)-(y.t||0)||(x.id<y.id?-1:1));
const split=(k,o)=>{o=cp(o);const f=CNT[k],c=f?+o[f]||0:0;if(f)delete o[f];return{o,s:cs(o),c}};
function refresh(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){};th();hd();if(!$('#dlg').open)go(cur)}

function merge(k,id,sv){
  const f=CNT[k],i=D[k].findIndex(x=>x.id==id),b=base[k][id],ss=split(k,sv);
  let o=ss.o,c=ss.c;
  if(i>=0&&b){const l=split(k,D[k][i]);if(l.s!=b.s)o={...ss.o,...l.o};c=ss.c+(l.c-b.c)}
  const n=f?{...o,[f]:c}:{...o};
  base[k][id]={s:ss.s,c:ss.c};
  const ch=i<0||cs(D[k][i])!=cs(n);
  if(i<0)D[k].push(n);else D[k][i]=n;
  return ch;
}

async function push(){
  if(!live||!auth.currentUser)return;
  for(const k of SYNC_COL){
    const f=CNT[k],have=new Set();
    for(const it of D[k]){
      have.add(it.id);
      const b=base[k][it.id],l=split(k,it);
      if(b&&b.s===l.s&&(!f||b.c===l.c))continue;
      const prev=b;base[k][it.id]={s:l.s,c:l.c};
      try{await setDoc(doc(db,cn(k),it.id),f?{...l.o,[f]:increment(l.c-(prev?prev.c:0))}:l.o,{merge:!!f})}
      catch(e){base[k][it.id]=prev;toast('ক্লাউডে সেভ হয়নি, ইন্টারনেট দেখুন')}
    }
    for(const id of Object.keys(base[k])){
      if(have.has(id))continue;
      const prev=base[k][id];delete base[k][id];
      try{await deleteDoc(doc(db,cn(k),id))}catch(e){base[k][id]=prev}
    }
  }
  if(SYNC_META){
    const ms=cs(D.shop),n=D.n;
    if(!mb||mb.s!=ms||mb.n!=n){
      const p=mb;mb={s:ms,n};
      try{await setDoc(doc(db,'store',PFX+'meta2'),{j:JSON.stringify(D.shop),n:increment(n-(p?p.n:0))},{merge:true})}
      catch(e){mb=p}
    }
  }
}
window.cloudSave=()=>{clearTimeout(timer);timer=setTimeout(push,700)};

function fin(){
  if(!live&&ready>=SYNC_COL.length+(SYNC_META?1:0)){live=true;ui=1;push()}
  if(ui){ui=0;refresh()}
}
function listen(){
  unsubs=SYNC_COL.map(k=>onSnapshot(collection(db,cn(k)),snap=>{
    if(!first[k]){
      if(snap.empty&&snap.metadata.fromCache)return;
      first[k]=1;
      if(!snap.empty){D[k]=[];base[k]={};snap.docs.forEach(d=>merge(k,d.id,d.data()));srt(D[k]);ui=1}
      ready++;
    }else{
      let c=0;
      snap.docChanges().forEach(x=>{
        const id=x.doc.id;
        if(x.type=='removed'){if(base[k][id]){D[k]=D[k].filter(y=>y.id!=id);delete base[k][id];c=1}}
        else if(merge(k,id,x.doc.data()))c=1;
      });
      if(c){srt(D[k]);ui=1}
    }
    fin();
  },e=>toast('ক্লাউড সংযোগে সমস্যা')));
  if(SYNC_META)unsubs.push(onSnapshot(doc(db,'store',PFX+'meta2'),s=>{
    if(!first.m){if(!s.exists()&&s.metadata.fromCache)return;first.m=1;ready++}
    if(s.exists()){
      const d=s.data(),sh=JSON.parse(d.j),keep=mb&&cs(D.shop)!=mb.s;let n=d.n||0;
      if(mb)n+=D.n-mb.n;
      const ch=(!keep&&cs(D.shop)!=cs(sh))||D.n!=n;
      if(!keep)D.shop=sh;D.n=n;mb={s:cs(sh),n:d.n||0};
      if(ch)ui=1;
    }
    fin();
  },e=>toast('ক্লাউড সংযোগে সমস্যা')));
}

// পুরোনো এক-ডকুমেন্টের ডেটা থাকলে নতুন কাঠামোয় আনা (শুধু হার্ডওয়্যারের জন্য)
async function migrate(){
  try{
    for(const k of COL){
      if((await getDocs(collection(db,k))).empty){const o=await getDoc(doc(db,'store',k));if(o.exists())D[k]=JSON.parse(o.data().j)}
    }
    if(!(await getDoc(doc(db,'store','meta2'))).exists()){const o=await getDoc(doc(db,'store','meta'));if(o.exists()){const v=JSON.parse(o.data().j);D.shop=v.shop;D.n=v.n}}
  }catch(e){}
}

window.login=async e=>{
  e.preventDefault();
  $('#lm').textContent='';
  try{await signInWithEmailAndPassword(auth,$('#le').value.trim(),$('#lp').value)}
  catch(x){$('#lm').textContent='লগইন হয়নি: ইমেইল বা পাসওয়ার্ড ভুল'}
  return false;
};
window.logout=()=>{cl();signOut(auth)};

// ৫ মিনিট কিছু না ছুঁলে অটো লগআউট (সময় বদলাতে 5 বদলান)
let idle;
const resetIdle=()=>{clearTimeout(idle);if(auth.currentUser)idle=setTimeout(()=>signOut(auth),5*60*1000)};
["click","keydown","touchstart","input"].forEach(e=>document.addEventListener(e,resetIdle,{passive:true}));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)resetIdle()});

onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];live=false;ready=0;ui=0;mb=null;first.m=0;
  const em=u?(u.email||'').toLowerCase():'';
  const isOwner=em==OWNER.toLowerCase();
  const isBro=em==BRO.toLowerCase();
  const isEmp=em==EMP.toLowerCase();
  if(u&&!isOwner&&!isBro&&!isEmp){
    await signOut(auth);
    $('#lm').textContent='এই অ্যাকাউন্টের অনুমতি নেই';
    $('#lo').style.display='grid';
    return;
  }
  PFX=isBro?'m_':'';window.PFX=PFX;
  SYNC_COL=COL;
  SYNC_META=true;
  if(u)useShop(isBro);
  COL.forEach(k=>{base[k]={};first[k]=0});
  $('#lo').style.display=u?'none':'grid';
  resetIdle();
  window.OWN=!!u&&isOwner;window.AI_ENABLED=!!u;
  document.querySelector('nav button[data-v=buy]').style.display=isOwner?'':'none';
  if(u){th();hd()}
  go(cur);
  if(u){if(isOwner)await migrate();listen()}
});
</script>
